<html>
	<head>
	<title>form	</title>
	<link rel="stylesheet"href="background.css">
</head>
<body>
	<div class="wrapper">
		<div></div>
		<div></div>
		<div></div>
		<div></div>

		<div></div>
		<div></div>

		<div></div>
	</div>
	<form action="berry.html">
		<div class="container">
		 <h1>FILL UP THE FORM</h1>
		 <div class="content">
<div class="text_age">			
AGE:
</div>
			<div class="age">
    <input type="number" class="age" size="2"name="age" placeholder="age" id="age" min="40" max="100" required>
	</div>
	<div class="gender">
    GENDER:
	</div>
	<div class="male">
    <input type="radio"name="sex" name="m"value="Male" required>
    MALE
    </div>
	<div class="female">
    <input type="radio"name="sex" name="f"value="Female" required>
    female<br>
	</div>
</div>
    <div class="date">
    <label for="date">Date Of Birth:</label>
    <input type="date" name="date" id="date" min="2000-05-10" max="2020-05-10" required>
    
    </div>	
	<div class="username">
    		USERNAME:
    		<input type="text" name="username" placeholder="username" required><br>
    		PASSWORD:
    		<input type="password" name="password" placeholder="password" required><br>
			</div>
    		<div class="email">
    		
    		<label for="email">Email:</label>
    		<input type="email" name="email" id="email" placeholder="email" required>
    		</div>
    		<div class="phone">
				phone:
				<select name="phonecode"required>
				<option>91</option>
				<option>92</option>
				<option>93</option>
				<option>94</option>
				</select>
    		<input type="number" size="20"placeholder="phone no" name="phone no"required>
    		</div>
    		
    <br>
	<div class="message">
    About yourself:
	</div>
    <textarea name="message" class="box" required></textarea><br>
   <div class="button">
	<a href="berry.html"><button class="button" value="button">continue</button> </a>
     </div>
	</div>
    </form>
    
    
</body>
</html>
